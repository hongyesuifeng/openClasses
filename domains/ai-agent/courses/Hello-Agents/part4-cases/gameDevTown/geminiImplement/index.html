<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏小镇 - 王者之路开发中</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🎮 游戏小镇 - 王者之路开发中</h1>
            <div class="live-indicator">
                <span class="live-dot"></span> Live ● Phase 2
            </div>
        </header>
        <main class="main-content">
            <div class="left-panel">
                <div id="office-scene" class="office-scene">
                    <h2>🏢 办公室场景</h2>
                    <div class="characters-grid">
                        <div class="character" id="character-alex">
                            <div class="avatar">🎬</div>
                            <div class="name">Alex (Producer)</div>
                            <div class="status-bubble" id="status-alex"></div>
                        </div>
                        <div class="character" id="character-cody">
                            <div class="avatar">💻</div>
                            <div class="name">Cody (Developer)</div>
                            <div class="status-bubble" id="status-cody"></div>
                        </div>
                        <div class="character" id="character-diana">
                            <div class="avatar">📝</div>
                            <div class="name">Diana (Designer)</div>
                            <div class="status-bubble" id="status-diana"></div>
                        </div>
                        <div class="character" id="character-arty">
                            <div class="avatar">🎨</div>
                            <div class="name">Arty (Artist)</div>
                            <div class="status-bubble" id="status-arty"></div>
                        </div>
                    </div>
                     <p class="hint">💬 点击角色查看详情 (功能待实现)</p>
                </div>
            </div>
            <div class="right-panel">
                <div id="project-dashboard" class="project-dashboard">
                    <h2>📋 项目看板</h2>
                    <div class="task-summary">
                        <div class="task-col" id="tasks-pending"><h3>待办</h3><span>○ 5</span></div>
                        <div class="task-col" id="tasks-in-progress"><h3>进行中</h3><span>● 3</span></div>
                        <div class="task-col" id="tasks-completed"><h3>已完成</h3><span>✓ 12</span></div>
                    </div>
                    <div id="meeting-info" class="meeting-info">
                         <h2>📊 当前会议: <span id="meeting-title">设计评审</span></h2>
                         <p>主题: <span id="meeting-topic">战斗系统设计</span></p>
                         <div class="progress-bar-container">
                             <div id="meeting-progress" class="progress-bar"></div>
                         </div>
                    </div>
                    <div id="decision-points" class="decision-points">
                        <h2>🎯 待决策事项</h2>
                        <ul>
                            <li>物理引擎 vs 动画驱动方案？</li>
                            <li>元素组合数量上限？</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
        <footer class="dialogue-section">
            <h2>💬 团队对话</h2>
            <div id="chat-container" class="chat-container">
                <!-- Messages will be dynamically inserted here -->
            </div>
            <div class="chat-controls">
                <button id="btn-continue">▶ 继续会议</button>
                <button id="btn-pause">⏸ 暂停</button>
                <button id="btn-skip" title="跳过当前话题 (功能待实现)">⏭ 跳过</button>
                <button id="btn-summary" title="查看会议纪要 (功能待实现)">📝 纪要</button>
            </div>
        </footer>
    </div>

    <div id="character-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <div id="modal-avatar" class="avatar"></div>
            <h3 id="modal-name"></h3>
            <p id="modal-role"></p>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="js/backend.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

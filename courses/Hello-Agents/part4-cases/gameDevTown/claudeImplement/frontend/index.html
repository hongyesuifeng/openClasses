<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏小镇 - Game Dev Town</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🎮</span>
                <h1>游戏小镇</h1>
                <span class="subtitle">Game Dev Town</span>
            </div>
            <div class="project-name">
                <span>项目：</span>
                <strong>九十九亿大战</strong>
            </div>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">连接中...</span>
            </div>
        </header>

        <!-- 主体内容 -->
        <main class="main-content">
            <!-- 左侧：角色面板 -->
            <aside class="characters-panel">
                <h2>团队成员</h2>
                <div class="characters-list" id="charactersList">
                    <!-- 角色卡片由 JS 动态生成 -->
                </div>
            </aside>

            <!-- 中间：会议区域 -->
            <section class="meeting-area">
                <!-- 会议控制 -->
                <div class="meeting-controls">
                    <div class="scenario-selector">
                        <label>选择场景：</label>
                        <select id="scenarioSelect">
                            <option value="game_fun_evaluation">游戏是否好玩讨论</option>
                            <option value="prototype_demo">原型Demo节点展示内容</option>
                            <option value="hero_design">新英雄设计讨论</option>
                            <option value="performance_issue">性能问题紧急讨论</option>
                            <option value="monetization">付费系统设计方案</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="startMeetingBtn">
                        🚀 开始会议
                    </button>
                    <button class="btn btn-secondary" id="endMeetingBtn" disabled>
                        📝 结束会议
                    </button>
                </div>

                <!-- 会议标题 -->
                <div class="meeting-header" id="meetingHeader" style="display: none;">
                    <h3 id="meetingTitle">会议标题</h3>
                    <span class="meeting-status-badge">进行中</span>
                </div>

                <!-- 消息列表 -->
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message">
                        <h2>👋 欢迎来到游戏小镇！</h2>
                        <p>这里是 AI Agent 协作开发游戏的演示平台。</p>
                        <p>选择一个场景，点击"开始会议"，观看团队成员讨论吧！</p>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area" id="inputArea" style="display: none;">
                    <input type="text" id="userInput" placeholder="输入你的想法参与讨论...">
                    <button class="btn btn-send" id="sendBtn">发送</button>
                </div>
            </section>

            <!-- 右侧：项目看板 -->
            <aside class="dashboard-panel">
                <h2>项目状态</h2>

                <!-- 进度概览 -->
                <div class="progress-card">
                    <h3>整体进度</h3>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="overallProgress" style="width: 0%"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>

                <!-- 当前阶段 -->
                <div class="phase-card">
                    <h3>当前阶段</h3>
                    <div class="current-phase" id="currentPhase">
                        <span class="phase-name">原型阶段</span>
                        <span class="phase-desc">核心玩法验证</span>
                    </div>
                </div>

                <!-- 任务统计 -->
                <div class="stats-card">
                    <h3>任务统计</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="totalTasks">0</span>
                            <span class="stat-label">总任务</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="completedTasks">0</span>
                            <span class="stat-label">已完成</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="inProgressTasks">0</span>
                            <span class="stat-label">进行中</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="blockedTasks">0</span>
                            <span class="stat-label">阻塞</span>
                        </div>
                    </div>
                </div>

                <!-- 最近活动 -->
                <div class="activity-card">
                    <h3>最近活动</h3>
                    <ul class="activity-list" id="activityList">
                        <li>系统初始化完成</li>
                    </ul>
                </div>
            </aside>
        </main>

        <!-- 底部状态栏 -->
        <footer class="app-footer">
            <div class="footer-left">
                <span id="meetingStatus">就绪</span>
            </div>
            <div class="footer-center">
                <span>Game Dev Town v1.0</span>
            </div>
            <div class="footer-right">
                <span id="agentSpeaking">-</span>
            </div>
        </footer>
    </div>

    <!-- 脚本 -->
    <script src="js/api.js?v=2"></script>
    <script src="js/chat.js?v=2"></script>
    <script src="js/characters.js?v=2"></script>
    <script src="js/dashboard.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>

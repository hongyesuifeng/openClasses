<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试 - AI编程研究</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .test-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .test-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }
        .output {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        .output.error {
            background: #f8d7da;
            color: #721c24;
        }
        .output.success {
            background: #d4edda;
            color: #155724;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .status.show { display: block; }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .meta {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 HuggingFace API 测试</h1>
            <p style="color: #7f8c8d;">测试Token有效性及"AI编程"主题的输出质量</p>
        </div>

        <!-- 测试1: 规划 -->
        <div class="test-card">
            <h3>📝 测试1: 研究计划生成（PlannerAgent）</h3>
            <p style="color: #7f8c8d; margin-bottom: 15px;">测试模型能否为"AI编程"主题生成高质量的研究计划</p>
            <div id="status1" class="status"></div>
            <button class="btn" onclick="runTest1()">▶ 开始测试</button>
            <div id="output1" class="output" style="display: none;"></div>
        </div>

        <!-- 测试2: 搜索 -->
        <div class="test-card">
            <h3>🔍 测试2: 搜索查询生成（SearcherAgent）</h3>
            <p style="color: #7f8c8d; margin-bottom: 15px;">测试模型能否生成相关的搜索查询</p>
            <div id="status2" class="status"></div>
            <button class="btn" onclick="runTest2()">▶ 开始测试</button>
            <div id="output2" class="output" style="display: none;"></div>
        </div>

        <!-- 测试3: 分析 -->
        <div class="test-card">
            <h3>🔬 测试3: 领域分析（AnalyzerAgent）</h3>
            <p style="color: #7f8c8d; margin-bottom: 15px;">测试模型对"AI编程"领域的深度分析能力</p>
            <div id="status3" class="status"></div>
            <button class="btn" onclick="runTest3()">▶ 开始测试</button>
            <div id="output3" class="output" style="display: none;"></div>
        </div>

        <!-- 全部测试 -->
        <div class="test-card">
            <h3>🚀 运行全部测试</h3>
            <p style="color: #7f8c8d; margin-bottom: 15px;">依次运行所有测试，全面评估API性能</p>
            <div id="status-all" class="status"></div>
            <button class="btn" onclick="runAllTests()">▶ 运行全部测试</button>
        </div>
    </div>

    <script>
        const API_TOKEN = 'YOUR_HUGGINGFACE_TOKEN_HERE';
        const MODEL_ID = 'Qwen/Qwen2.5-7B-Instruct';
        // 使用本地代理服务器避免CORS问题
        const PROXY_URL = 'http://localhost:5000';

        async function callAPI(messages, maxTokens = 2048) {
            const response = await fetch(`${PROXY_URL}/api/chat/${MODEL_ID}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: messages,
                    max_tokens: maxTokens,
                    temperature: 0.7,
                    top_p: 0.95,
                    api_token: API_TOKEN  // 在请求体中传递token
                })
            });

            if (!response.ok) {
                const error = await response.text();
                throw new Error(`API错误 (${response.status}): ${error}`);
            }

            return await response.json();
        }

        function showStatus(id, message, type) {
            const el = document.getElementById(id);
            el.className = `status show ${type}`;
            el.textContent = message;
        }

        function showOutput(id, content, type = '') {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.className = `output ${type}`;
            el.textContent = content;
        }

        async function runTest1() {
            const statusId = 'status1';
            const outputId = 'output1';

            showStatus(statusId, '⏳ 正在测试研究计划生成...', 'loading');

            try {
                const startTime = Date.now();
                const data = await callAPI([
                    {
                        role: 'system',
                        content: '你是研究代理系统中的规划Agent，负责为研究主题制定详细的执行计划。请用中文回答，输出清晰、结构化的计划。'
                    },
                    {
                        role: 'user',
                        content: '研究主题: AI编程\n\n请为这个主题制定一个研究计划，包含5-7个具体步骤，每个步骤都要有明确的目标和预期成果。'
                    }
                ]);
                const duration = Date.now() - startTime;

                const result = data.choices[0].message.content;
                const meta = `响应时间: ${duration}ms | Token使用: ${data.usage?.total_tokens || 'N/A'}`;

                showOutput(outputId, result + '\n\n' + '─'.repeat(80) + '\n' + meta, 'success');
                showStatus(statusId, `✅ 测试完成 (${duration}ms)`, 'success');

            } catch (error) {
                showOutput(outputId, '错误: ' + error.message, 'error');
                showStatus(statusId, '❌ 测试失败', 'error');
            }
        }

        async function runTest2() {
            const statusId = 'status2';
            const outputId = 'output2';

            showStatus(statusId, '⏳ 正在测试搜索查询生成...', 'loading');

            try {
                const startTime = Date.now();
                const data = await callAPI([
                    {
                        role: 'system',
                        content: '你是研究代理系统中的搜索Agent，负责为研究主题生成高质量的搜索查询。返回JSON格式。'
                    },
                    {
                        role: 'user',
                        content: '研究主题: AI编程\n\n请生成5个搜索查询，每个查询包含:\n- query: 搜索关键词\n- source: 来源类型(academic/web/news)\n- reason: 选择这个查询的原因\n\n返回JSON格式: {"queries": [...]}'
                    }
                ], 1024);
                const duration = Date.now() - startTime;

                const result = data.choices[0].message.content;
                const meta = `响应时间: ${duration}ms | Token使用: ${data.usage?.total_tokens || 'N/A'}`;

                showOutput(outputId, result + '\n\n' + '─'.repeat(80) + '\n' + meta, 'success');
                showStatus(statusId, `✅ 测试完成 (${duration}ms)`, 'success');

            } catch (error) {
                showOutput(outputId, '错误: ' + error.message, 'error');
                showStatus(statusId, '❌ 测试失败', 'error');
            }
        }

        async function runTest3() {
            const statusId = 'status3';
            const outputId = 'output3';

            showStatus(statusId, '⏳ 正在测试领域分析能力...', 'loading');

            try {
                const startTime = Date.now();
                const data = await callAPI([
                    {
                        role: 'system',
                        content: '你是研究代理系统中的分析Agent，擅长对技术领域进行深度分析。请从历史发展、当前挑战、未来趋势三个维度进行分析。'
                    },
                    {
                        role: 'user',
                        content: '请对"AI编程"领域进行深度分析，包括:\n1. 历史发展脉络\n2. 当前面临的挑战\n3. 未来发展趋势\n\n每个部分都要有具体的要点和说明。'
                }
                ]);
                const duration = Date.now() - startTime;

                const result = data.choices[0].message.content;
                const meta = `响应时间: ${duration}ms | Token使用: ${data.usage?.total_tokens || 'N/A'}`;

                showOutput(outputId, result + '\n\n' + '─'.repeat(80) + '\n' + meta, 'success');
                showStatus(statusId, `✅ 测试完成 (${duration}ms)`, 'success');

            } catch (error) {
                showOutput(outputId, '错误: ' + error.message, 'error');
                showStatus(statusId, '❌ 测试失败', 'error');
            }
        }

        async function runAllTests() {
            showStatus('status-all', '⏳ 正在运行全部测试...', 'loading');

            await runTest1();
            await new Promise(r => setTimeout(r, 1000));

            await runTest2();
            await new Promise(r => setTimeout(r, 1000));

            await runTest3();

            showStatus('status-all', '✅ 全部测试完成！', 'success');
        }

        // 页面加载完成后自动运行全部测试
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>

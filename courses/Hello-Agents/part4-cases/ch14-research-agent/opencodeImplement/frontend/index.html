<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Agent - 智能研究助手</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Research Agent</h1>
            <p class="subtitle">基于课程第14章 - 研究代理 (Ollama版)</p>
        </header>
        
        <!-- 模型加载状态 -->
        <section class="model-status" id="modelStatus">
            <div class="model-info">
                <span class="model-label">模型:</span>
                <span class="model-name" id="modelName">Qwen2.5-0.5B</span>
                <span class="model-state" id="modelState">连接中...</span>
            </div>
            <div class="model-progress" id="modelProgress" style="display: none;">
                <div class="progress-bar" style="width: 200px;">
                    <div class="progress-fill" id="modelProgressFill"></div>
                </div>
                <span class="progress-text" id="modelProgressText">0%</span>
            </div>
        </section>
        
        <section class="input-section">
            <div class="input-group">
                <input type="text" id="topic" placeholder="输入研究主题，例如：人工智能在医疗诊断中的应用" />
                <button id="researchBtn">开始研究</button>
            </div>
            <div class="quick-topics">
                <span>快速开始：</span>
                <button class="quick-btn" data-topic="大语言模型在教育中的应用">LLM教育</button>
                <button class="quick-btn" data-topic="区块链技术在供应链管理中的应用">区块链供应链</button>
                <button class="quick-btn" data-topic="量子计算发展趋势">量子计算</button>
            </div>
        </section>
        
        <section class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-header">
                <span>研究进度</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-messages" id="progressMessages"></div>
        </section>
        
        <section class="result-section" id="resultSection" style="display: none;">
            <div class="result-tabs">
                <button class="tab-btn active" data-tab="report">研究报告</button>
                <button class="tab-btn" data-tab="sources">参考资料</button>
            </div>
            
            <div class="tab-content active" id="reportTab">
                <div class="report-content" id="reportContent"></div>
            </div>
            
            <div class="tab-content" id="sourcesTab">
                <div class="sources-list" id="sourcesList"></div>
            </div>
        </section>
        
        <footer class="course-info">
            <h3>📚 课程核心知识点</h3>
            <div class="knowledge-cards">
                <div class="card">
                    <h4>1. 信息检索</h4>
                    <p>查询生成、多源检索、结果排序</p>
                </div>
                <div class="card">
                    <h4>2. 内容分析</h4>
                    <p>文档解析，信息抽取、摘要生成</p>
                </div>
                <div class="card">
                    <h4>3. 知识整合</h4>
                    <p>实体对齐、关系提取、知识图谱</p>
                </div>
                <div class="card">
                    <h4>4. 报告生成</h4>
                    <p>结构化撰写、引用管理、可视化</p>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="/js/ollama_service.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>

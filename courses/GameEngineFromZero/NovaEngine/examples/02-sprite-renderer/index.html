<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaEngine - Sprite Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 { margin-bottom: 20px; font-weight: 300; }
    canvas { border: 1px solid #333; border-radius: 4px; }
    .info { margin-top: 20px; font-size: 14px; color: #888; }
    .controls { margin-top: 10px; display: flex; gap: 10px; }
    button {
      padding: 8px 16px;
      background: #4a9eff;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #3a8eef; }
  </style>
</head>
<body>
  <h1>Sprite Renderer Demo</h1>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="info">第4周示例 - Sprite 批处理渲染</div>
  <div class="controls">
    <button id="addBtn">添加 Sprite</button>
    <button id="clearBtn">清除所有</button>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
